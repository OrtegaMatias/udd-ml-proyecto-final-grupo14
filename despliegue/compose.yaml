# Simulador en un servidor Linux (CPU). Uso, desde la raíz del repositorio:
#   1) despliegue/.env con TABPFN_TOKEN=... (no se versiona)
#   2) despliegue/.env.portero con el usuario y el hash de la contraseña (no se versiona; ver portero/portero.py)
#   3) docker compose -f despliegue/compose.yaml up -d --build
name: udd-ml-simulador
services:
  api:
    build: { context: .., dockerfile: despliegue/Dockerfile.api }
    image: udd-ml-simulador-api:local
    env_file: .env
    # Modelo ya ajustado (save_fitted_tabpfn_model), copiado aparte: no está en el repositorio
    volumes: [tabpfn-cache:/root/.cache, ../modelo_ajustado:/app/modelo_ajustado:ro]
    # El servidor es modesto (4 núcleos) y comparte la máquina con otras apps: la API usa a lo más 3 de 4
    cpus: 3
    mem_limit: 6g
    restart: unless-stopped
  web:
    build: { context: .., dockerfile: despliegue/Dockerfile.web }
    depends_on: [api]
    cpus: 0.5
    mem_limit: 512m
    restart: unless-stopped
  streamlit:
    image: udd-ml-simulador-api:local
    command: ["streamlit", "run", "simulador/app_streamlit.py", "--server.port", "8501", "--server.address", "0.0.0.0",
              "--server.baseUrlPath", "streamlit", "--server.headless", "true"]
    environment: { API_SIMULADOR: "http://api:8014" }
    depends_on: [api]
    cpus: 0.5
    mem_limit: 512m
    restart: unless-stopped
  portero:
    image: python:3.12-alpine
    command: ["python", "/portero/portero.py"]
    env_file: .env.portero
    volumes: ["./portero:/portero:ro"]
    cpus: 0.25
    mem_limit: 128m
    restart: unless-stopped
  puerta:
    image: nginx:1.29-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["8096:80"]
    depends_on: [web, streamlit, portero]
    cpus: 0.5
    mem_limit: 512m
    restart: unless-stopped
volumes:
  tabpfn-cache:
