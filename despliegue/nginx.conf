# Única puerta de entrada. Sin sesión, todo redirige a la página de acceso (/acceso), que atiende el portero.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server {
  listen 80;
  absolute_redirect off;   # Location relativa: detrás del túnel el esquema real es https
  proxy_read_timeout 600s;
  proxy_send_timeout 600s;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

  # nginx pregunta al portero si la cookie de sesión es válida
  location = /acceso/verificar {
    internal;
    proxy_pass http://portero:8000/acceso/verificar;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
  }
  # Página de acceso, logo y salida: sin sesión
  location /acceso {
    proxy_pass http://portero:8000;
  }
  location @entrar {
    return 302 /acceso?siguiente=$uri;
  }

  # El botón "Iniciar la API" solo sirve en el Mac local
  location /control/ { return 404; }

  location /streamlit/ {
    auth_request /acceso/verificar;
    error_page 401 = @entrar;
    proxy_pass http://streamlit:8501;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
  location / {
    auth_request /acceso/verificar;
    error_page 401 = @entrar;
    proxy_pass http://web:3014;
  }
}
